name: Build Windows app

# Every push to main builds Snowly.exe and attaches it to the run (Actions tab → run → Artifacts).
# Pushing a tag like v1.0.1 also publishes a GitHub Release with the zip.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Package Snowly.exe
        run: npm run pack

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Snowly-win32-x64/* -DestinationPath Snowly-win-x64.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Snowly-win-x64
          path: Snowly-win-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Snowly-win-x64.zip
          generate_release_notes: true
