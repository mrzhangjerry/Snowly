name: Build Windows app

# Every push to main checks the Windows API bindings, builds Snowly.exe and publishes it as a GitHub Release named after
# the version in package.json (v1.0.0, ...). Bump "version" to start a new release;
# pushes without a bump refresh the zip on the current release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check Windows API bindings
        run: node scripts/check-winapi.js

      - name: Package Snowly.exe
        run: npm run pack

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Snowly-win32-x64/* -DestinationPath Snowly-win-x64.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Snowly-win-x64
          path: Snowly-win-x64.zip

      - name: Read version
        id: ver
        shell: pwsh
        run: echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Snowly ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Snowly-win-x64.zip
          overwrite_files: true
          generate_release_notes: true
