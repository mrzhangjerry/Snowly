<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Snowly</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  #c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}

  /* ---- browser preview only (no Electron): fake desktop + Windows-style taskbar ---- */
  body.demo{background:#0b1030 url("../assets/wallpaper.jpg") center/cover no-repeat;font-family:"Segoe UI",sans-serif}
  body.demo #c{height:calc(100% - 48px)}
  #taskbar{display:none}
  body.demo #taskbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:48px;align-items:center;gap:6px;
    padding:0 12px;background:rgba(28,30,36,.92);border-top:1px solid rgba(255,255,255,.08);color:#fff;font-size:12px}
  #taskbar .ic{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font-size:20px}
  #taskbar .search{height:32px;width:190px;border-radius:16px;background:rgba(255,255,255,.1);display:flex;align-items:center;padding:0 12px;color:#ccc}
  #taskbar .sp{flex:1}
  #taskbar .clock{text-align:right;line-height:1.3}
  #taskbar .hint{color:#aab;margin-right:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="taskbar">
  <div class="ic" style="color:#4cc2ff">⊞</div>
  <div class="search">⌕&nbsp; Search</div>
  <div class="ic">📁</div><div class="ic">🌐</div><div class="ic">✉️</div><div class="ic">🎵</div><div class="ic">📝</div>
  <div class="sp"></div>
  <div class="hint">Browser preview · the real app piles snow on your actual taskbar</div>
  <div class="clock">8:23 PM<br>11/17/2026</div>
</div>
<script src="snow.js"></script>
</body>
</html>
